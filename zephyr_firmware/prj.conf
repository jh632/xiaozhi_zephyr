# 控制台与日志
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# GPIO 与输入子系统 (交互按键)
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# I2C (编解码器控制通道与板载器件)
CONFIG_I2C=y

# 音频: I2S 数据通道 + 编解码器控制通道
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

# 功放电源开关要在使用它的编解码器之前完成初始化(设备树中 pa-supply 声明了该依赖)
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=55
