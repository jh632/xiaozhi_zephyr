# 控制台与日志
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

# 音频: ES8311 的控制通道走 I2C, PCM 走 I2S
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y
CONFIG_GPIO=y

# 功放电源开关要在使用它的编解码器之前完成初始化(设备树中 pa-supply 声明了该依赖)
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=55
