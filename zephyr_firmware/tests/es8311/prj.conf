CONFIG_ZTEST=y

# I2C 总线与器件模拟
CONFIG_I2C=y
CONFIG_EMUL=y
CONFIG_I2C_EMUL=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# 音频编解码器与功放电源开关
CONFIG_REGULATOR=y
CONFIG_AUDIO=y
CONFIG_AUDIO_CODEC=y

# 功放电源开关要在使用它的编解码器之前完成初始化(设备树中 pa-supply 声明了该依赖)
CONFIG_REGULATOR_FIXED_INIT_PRIORITY=55

CONFIG_LOG=y
CONFIG_AUDIO_CODEC_LOG_LEVEL_DBG=y
